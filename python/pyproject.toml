[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neuroseti-data"
version = "0.6.0"
description = "Zero-dependency Python SDK & LLM tool adapters for Neuroseti.ru Open Data API (RF: FNS INN, CBR, OKVED-2, ICD-10, GRLS, Roszdravnadzor, Rospatent, Chestny ZNAK, SRO NOSTROY/NOPRIZ, RF real estate & IT salaries)."
readme = "../README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Neuroseti.ru", email = "vitaliyvino@gmail.com" }
]
keywords = ["russia", "open-data", "mcp", "llm", "langchain", "openai", "fns", "cbr", "grls", "chestny-znak", "neuroseti"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://neuroseti.ru/open-api"
Documentation = "https://neuroseti.ru/llms-full.txt"
Repository = "https://github.com/vitaliyvino/neuroseti-mcp"
OpenAPI = "https://neuroseti.ru/openapi.json"

[tool.setuptools.packages.find]
where = ["src"]
